spring.application.name=ai-scamshield
spring.config.import=optional:file:.env[.properties]

# ---------------- Database ----------------
# Default to H2 for local development so the app runs without a local MySQL password/configuration.
# Override with DB_URL, DB_USERNAME, DB_PASSWORD, and DB_DRIVER_CLASS_NAME if you want MySQL instead.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/scamshield_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# ---------------- Server ----------------
server.port=${SERVER_PORT:8080}

# ---------------- JWT ----------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional first-run admin provisioning. Leave unset to create no default accounts.
app.seed.admin.username=${SEED_ADMIN_USERNAME:}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}

# ---------------- AI Provider ----------------
# If ai.provider.api-key is blank, the app automatically falls back to the
# local rule-based NLP analysis engine (FallbackScamDetectionService).
ai.provider.enabled=${AI_PROVIDER_ENABLED:false}
ai.provider.api-key=${AI_PROVIDER_API_KEY:}
ai.provider.url=${AI_PROVIDER_URL:https://api.anthropic.com/v1/messages}
ai.provider.model=${AI_PROVIDER_MODEL:claude-sonnet-4-6}
ai.provider.timeout-ms=${AI_PROVIDER_TIMEOUT_MS:8000}

# ---------------- CORS ----------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# ---------------- Logging ----------------
logging.level.com.scamshield=INFO

# Deterministic fallback NLP scoring. Category weights scale the base feature weights.
scam.analysis.safe-max-risk=${SCAM_SAFE_MAX_RISK:24}
scam.analysis.suspicious-max-risk=${SCAM_SUSPICIOUS_MAX_RISK:59}
scam.analysis.weights.urgency=${SCAM_WEIGHT_URGENCY:1.0}
scam.analysis.weights.financial=${SCAM_WEIGHT_FINANCIAL:1.0}
scam.analysis.weights.credential=${SCAM_WEIGHT_CREDENTIAL:1.0}
scam.analysis.weights.reward=${SCAM_WEIGHT_REWARD:1.0}
scam.analysis.weights.job=${SCAM_WEIGHT_JOB:1.0}
scam.analysis.weights.impersonation=${SCAM_WEIGHT_IMPERSONATION:1.0}
scam.analysis.weights.personal-information=${SCAM_WEIGHT_PERSONAL_INFORMATION:1.0}
scam.analysis.weights.link=${SCAM_WEIGHT_LINK:1.0}
scam.analysis.weights.url=${SCAM_WEIGHT_URL:1.0}
scam.analysis.weights.sender=${SCAM_WEIGHT_SENDER:1.0}
scam.analysis.weights.style=${SCAM_WEIGHT_STYLE:1.0}

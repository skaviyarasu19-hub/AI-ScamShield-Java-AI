<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - AI ScamShield</title>
<link rel="stylesheet" href="css/styles.css?v=20260927-premium" />
</head>
<body>
  <div id="navbar-mount"></div>

  <div class="container">
    <div class="page-title">Admin Dashboard</div>
    <div class="page-subtitle">System-wide statistics and user management</div>

    <div class="grid grid-4" style="margin-bottom:24px;">
      <div class="card stat-card">
        <div class="label">Total Users</div>
        <div class="value" id="stat-users">-</div>
      </div>
      <div class="card stat-card">
        <div class="label">Total Scans</div>
        <div class="value" id="stat-scans">-</div>
      </div>
      <div class="card stat-card scam">
        <div class="label">Likely Scams Detected</div>
        <div class="value" id="stat-likely-scam">-</div>
      </div>
      <div class="card stat-card suspicious">
        <div class="label">Suspicious Detections</div>
        <div class="value" id="stat-suspicious">-</div>
      </div>
    </div>

    <div class="card">
      <div class="section-label" style="margin-top:0;">Registered Users</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Username</th><th>Email</th><th>Roles</th><th>Total Scans</th><th>Joined</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="7" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=20260927-file-origin"></script>
  <script>
    Auth.requireAdmin();
    renderNavbar("admin.html");

    async function loadAdminData() {
      try {
        const stats = await apiRequest("/admin/statistics");
        document.getElementById("stat-users").textContent = stats.totalUsers;
        document.getElementById("stat-scans").textContent = stats.totalScans;
        document.getElementById("stat-likely-scam").textContent = stats.likelyScamCount;
        document.getElementById("stat-suspicious").textContent = stats.suspiciousCount;

        const users = await apiRequest("/admin/users");
        renderUsers(users);
      } catch (err) {
        document.getElementById("users-body").innerHTML =
          `<tr><td colspan="7" class="empty-state">${err.message}</td></tr>`;
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById("users-body");
      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No users found.</td></tr>`;
        return;
      }
      tbody.innerHTML = users
        .map(
          (u) => `
          <tr>
            <td>${u.username}</td>
            <td>${u.email}</td>
            <td>${u.roles.map((r) => r.replace("ROLE_", "")).join(", ")}</td>
            <td>${u.totalScans}</td>
            <td>${formatDate(u.createdAt)}</td>
            <td><span class="pill ${u.enabled ? "enabled" : "disabled"}">${u.enabled ? "Active" : "Disabled"}</span></td>
            <td>
              <button class="btn ${u.enabled ? "btn-danger" : "btn-secondary"}" style="padding:6px 12px;font-size:.78rem;"
                onclick="toggleUser(${u.id}, ${!u.enabled})">
                ${u.enabled ? "Disable" : "Enable"}
              </button>
            </td>
          </tr>`
        )
        .join("");
    }

    async function toggleUser(id, enable) {
      try {
        await apiRequest(`/admin/users/${id}/status`, {
          method: "PUT",
          body: { enabled: enable },
        });
        loadAdminData();
      } catch (err) {
        alert(err.message);
      }
    }

    loadAdminData();
  </script>
</body>
</html>
